openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: KKN Team Website API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Member authentication
  - name: members
    description: Daftar dan profil anggota tim
  - name: announcements
    description: Pengumuman
  - name: schedules
    description: Jadwal piket masak, bersih-bersih, program kejar
  - name: inventory
    description: List barang
  - name: deadlines
    description: List deadline tugas & kegiatan
  - name: complaints
    description: Keluhan kehidupan harian
  - name: issues
    description: Masalah proker / urusan KKN
  - name: templates
    description: Template pekerjaan
  - name: kas
    description: Kas dan keuangan tim
  - name: dashboard
    description: Dashboard summary
  - name: notulensi
    description: Notulensi rapat tim
  - name: storage
    description: Object storage upload dan serving
  - name: conditions
    description: Kondisi pribadi anggota (alergi, sakit bawaan, fobia, lainnya)
  - name: attendance
    description: Absensi harian anggota

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: adminLogout
      tags: [auth]
      summary: Admin logout
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Get current auth status
      responses:
        "200":
          description: Auth status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"

  /auth/change-password:
    post:
      operationId: changeOwnPassword
      tags: [auth]
      summary: Change own password (requires login)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Validation error
        "401":
          description: Not logged in or current password wrong

  /auth/change-password/{id}:
    post:
      operationId: changeUserPassword
      tags: [auth]
      summary: Change another member's password (ketua only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeUserPasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Validation error
        "403":
          description: Forbidden (ketua only)
        "404":
          description: Member not found

  /permissions:
    get:
      operationId: getPermissions
      tags: [permissions]
      summary: Get all managed role permissions (ketua only)
      responses:
        "200":
          description: List of permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"
        "403":
          description: Forbidden
    put:
      operationId: setPermission
      tags: [permissions]
      summary: Grant or revoke a role's edit access to a resource (ketua only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionInput"
      responses:
        "200":
          description: Updated permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Permission"
        "400":
          description: Invalid input
        "403":
          description: Forbidden

  /announcements:
    get:
      operationId: getAnnouncements
      tags: [announcements]
      summary: Get all announcements
      responses:
        "200":
          description: List of announcements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Announcement"
    post:
      operationId: createAnnouncement
      tags: [announcements]
      summary: Create announcement (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"

  /announcements/{id}:
    patch:
      operationId: updateAnnouncement
      tags: [announcements]
      summary: Update announcement (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
    delete:
      operationId: deleteAnnouncement
      tags: [announcements]
      summary: Delete announcement (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /schedules/cooking:
    get:
      operationId: getCookingSchedules
      tags: [schedules]
      summary: Get cooking schedules (jadwal piket masak)
      responses:
        "200":
          description: Cooking schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CookingSchedule"
    post:
      operationId: createCookingSchedule
      tags: [schedules]
      summary: Create cooking schedule (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CookingScheduleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookingSchedule"

  /schedules/cooking/{id}:
    patch:
      operationId: updateCookingSchedule
      tags: [schedules]
      summary: Update cooking schedule (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CookingScheduleUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookingSchedule"
    delete:
      operationId: deleteCookingSchedule
      tags: [schedules]
      summary: Delete cooking schedule (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /schedules/cleaning:
    get:
      operationId: getCleaningSchedules
      tags: [schedules]
      summary: Get cleaning schedules (jadwal bersih-bersih)
      responses:
        "200":
          description: Cleaning schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CleaningSchedule"
    post:
      operationId: createCleaningSchedule
      tags: [schedules]
      summary: Create cleaning schedule (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CleaningScheduleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CleaningSchedule"

  /schedules/cleaning/{id}:
    patch:
      operationId: updateCleaningSchedule
      tags: [schedules]
      summary: Update cleaning schedule (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CleaningScheduleUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CleaningSchedule"
    delete:
      operationId: deleteCleaningSchedule
      tags: [schedules]
      summary: Delete cleaning schedule (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /schedules/programs:
    get:
      operationId: getProgramSchedules
      tags: [schedules]
      summary: Get program kejar schedules
      responses:
        "200":
          description: Program schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgramSchedule"
    post:
      operationId: createProgramSchedule
      tags: [schedules]
      summary: Create program kejar schedule (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramScheduleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramSchedule"

  /schedules/programs/{id}:
    patch:
      operationId: updateProgramSchedule
      tags: [schedules]
      summary: Update program schedule (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramScheduleUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramSchedule"
    delete:
      operationId: deleteProgramSchedule
      tags: [schedules]
      summary: Delete program schedule (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /inventory:
    get:
      operationId: getInventory
      tags: [inventory]
      summary: Get inventory list (list barang)
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [kelompok, pribadi, pinjaman]
          description: Filter by item type
        - name: owner
          in: query
          schema:
            type: string
          description: Filter by owner name (for pribadi items)
      responses:
        "200":
          description: Inventory items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"
    post:
      operationId: createInventoryItem
      tags: [inventory]
      summary: Add inventory item (admin for kelompok, login for pribadi)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"

  /inventory/{id}:
    patch:
      operationId: updateInventoryItem
      tags: [inventory]
      summary: Update inventory item (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
    delete:
      operationId: deleteInventoryItem
      tags: [inventory]
      summary: Delete inventory item (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /inventory/catalog:
    get:
      operationId: getItemCatalog
      tags: [inventory]
      summary: Get item catalog (nama + satuan baku)
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [alat_kebersihan, alat_masak, alat_makan, alat_tulis, alat_elektronik, pakaian, stock_makanan, device, darurat, tempat_tidur]
          description: Filter by category
      responses:
        "200":
          description: Catalog entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogItem"
    post:
      operationId: createCatalogItem
      tags: [inventory]
      summary: Create catalog entry (ketua/sekretaris only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogItem"
        "403":
          description: Forbidden
        "409":
          description: Name already exists in catalog

  /inventory/catalog/{id}:
    put:
      operationId: updateCatalogItem
      tags: [inventory]
      summary: Update catalog entry (ketua/sekretaris only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogItemInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogItem"
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: deleteCatalogItem
      tags: [inventory]
      summary: Delete catalog entry (ketua/sekretaris only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          description: Not found

  /deadlines:
    get:
      operationId: getDeadlines
      tags: [deadlines]
      summary: Get deadlines list
      responses:
        "200":
          description: Deadlines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deadline"
    post:
      operationId: createDeadline
      tags: [deadlines]
      summary: Create deadline (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeadlineInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deadline"

  /deadlines/{id}:
    patch:
      operationId: updateDeadline
      tags: [deadlines]
      summary: Update deadline (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeadlineUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deadline"
    delete:
      operationId: deleteDeadline
      tags: [deadlines]
      summary: Delete deadline (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /complaints:
    get:
      operationId: getComplaints
      tags: [complaints]
      summary: Get daily life complaints (keluhan)
      responses:
        "200":
          description: Complaints
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Complaint"
    post:
      operationId: createComplaint
      tags: [complaints]
      summary: Create complaint (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplaintInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Complaint"

  /complaints/{id}:
    patch:
      operationId: updateComplaint
      tags: [complaints]
      summary: Update complaint (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplaintUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Complaint"
    delete:
      operationId: deleteComplaint
      tags: [complaints]
      summary: Delete complaint (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /issues:
    get:
      operationId: getIssues
      tags: [issues]
      summary: Get KKN program issues (masalah proker)
      responses:
        "200":
          description: Issues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Issue"
    post:
      operationId: createIssue
      tags: [issues]
      summary: Create issue (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"

  /issues/{id}:
    patch:
      operationId: updateIssue
      tags: [issues]
      summary: Update issue (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
    delete:
      operationId: deleteIssue
      tags: [issues]
      summary: Delete issue (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /templates:
    get:
      operationId: getTemplates
      tags: [templates]
      summary: Get work templates
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"
    post:
      operationId: createTemplate
      tags: [templates]
      summary: Create template (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"

  /templates/{id}:
    patch:
      operationId: updateTemplate
      tags: [templates]
      summary: Update template (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
    delete:
      operationId: deleteTemplate
      tags: [templates]
      summary: Delete template (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /kas:
    get:
      operationId: getKas
      tags: [kas]
      summary: Get all kas transactions
      parameters:
        - name: fund
          in: query
          schema:
            type: string
            enum: [umum, darurat, iuran_makan, proker]
          description: Filter by fund
      responses:
        "200":
          description: Kas list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Kas"
    post:
      operationId: createKas
      tags: [kas]
      summary: Create kas entry (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KasInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kas"

  /kas/{id}:
    patch:
      operationId: updateKas
      tags: [kas]
      summary: Update kas entry (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KasUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kas"
    delete:
      operationId: deleteKas
      tags: [kas]
      summary: Delete kas entry (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /kas/config:
    get:
      operationId: getKasConfig
      tags: [kas]
      summary: Get kas config (iuran makan mingguan, target dana darurat)
      responses:
        "200":
          description: Config values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KasConfig"
    post:
      operationId: updateKasConfig
      tags: [kas]
      summary: Update kas config (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KasConfigInput"
      responses:
        "200":
          description: Updated config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KasConfig"

  /kas/summary:
    get:
      operationId: getKasSummary
      tags: [kas]
      summary: Get kas summary per fund + jatah makan harian + status darurat
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KasSummary"

  /kas/iuran-payments:
    get:
      operationId: getIuranPayments
      tags: [kas]
      summary: Get iuran makan payment status per member for a week
      parameters:
        - name: week
          in: query
          required: true
          schema:
            type: string
          description: ISO week label e.g. 2026-W23
      responses:
        "200":
          description: List of payments for the week
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IuranMakanPayment"
    post:
      operationId: createIuranPayment
      tags: [kas]
      summary: Mark member as paid for the week (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IuranMakanPaymentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IuranMakanPayment"
        "409":
          description: Already paid

  /kas/iuran-payments/{id}:
    delete:
      operationId: deleteIuranPayment
      tags: [kas]
      summary: Unmark payment (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /kas/iuran-payments/summary:
    get:
      operationId: getIuranPaymentsSummary
      tags: [kas]
      summary: Get total iuran paid per member across all weeks
      responses:
        "200":
          description: Per-member summary
          content:
            application/json:
              schema:
                type: array
                items:
